plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
}

group = mod_group_id
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

// =====================================================================================
// 私有测试台（testbench）—— 默认完全不参与编译、打包、发布。
// -------------------------------------------------------------------------------------
// 这是一批**私活测试**代码，用来逐项量化"绕过减伤"的手段（tag 档位 / 反取消 / 各阶段
// floor / END 层返还 / 多段 / 写血 / 摘附魔）。它：
//   * 目录在仓库根的 testbench/，已写进 .gitignore —— 不进版本库、不能上传 GitHub；
//   * **默认完全不参与编译、不参与打包**，普通 jar 里一行都不会有；
//   * 只有显式加 -Ptestbench 才会并入构建，且产物改名成 *-testbench.jar 以便一眼分辨。
//
//     gradlew build                 -> 干净 jar（发布用）
//     gradlew build -Ptestbench     -> golems_arsenal-<版本>-testbench.jar（只在自己机器上用）
//
// 注意：源集必须在这一段（minecraft 块之前）注册，因为下面的 runs.mods 会立刻引用它。
// =====================================================================================
def testbenchEnabled = project.hasProperty('testbench')

sourceSets {
    testbench {
        java.srcDir 'testbench/java'
        resources.srcDir 'testbench/resources'
        // main 的编译产物 + main 的编译类路径（含 ForgeGradle 注入的 Minecraft 依赖与所有 libs）
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
    }
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // 本家与 l2library 都带 mixin，而它们的 refmap 里存的是 SRG 名。
            // 开发环境跑的是 official 名，不告诉 Mixin 去哪张表做映射的话，
            // 依赖里的 mixin 会报 "target not found"（l2library 的 EntityMixin 就是第一个撞上的）。
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            mods {
                "${mod_id}" {
                    source sourceSets.main
                    // 只有 -Ptestbench 时 IDE / run 配置才看得见测试台源码。
                    // 注意：这个闭包的 delegate 是 ModConfig，看不到脚本里的局部变量，
                    // 所以这里要直接问 project，不能用 testbenchEnabled。
                    if (project.hasProperty('testbench')) {
                        source sourceSets.testbench
                    }
                }
            }
        }
        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }
        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }
    }
}

repositories {
    mavenLocal() // 重要：供本地发布测试使用
    maven { url 'https://maven.minecraftforge.net' }
    maven { url 'https://maven.tterrag.com/' }
    maven { url 'https://maven.blamejared.com' }
    maven { url 'https://www.cursemaven.com' }
    maven { url 'https://maven.theillusivec4.top/' }
    maven { url "https://maven.shadowsoffire.dev/releases" }
    maven { url 'https://jitpack.io' }
    maven {
        name "Modrinth"
        url "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    // flatDir 保留，但最好用 MavenLocal 替代
    flatDir { dirs 'libs' }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    implementation fg.deobf("dev.xkmc.l2library:l2library:${l2library_version}-slim")
    implementation fg.deobf("dev.xkmc.l2serial:l2serial:1.2.2")
    implementation fg.deobf("dev.xkmc.l2screentracker:l2screentracker:0.1.4")
    implementation fg.deobf("dev.xkmc.l2tabs:l2tabs:0.3.3")
    implementation fg.deobf("dev.xkmc.l2itemselector:l2itemselector:0.1.9")
    implementation fg.deobf("dev.xkmc.l2damagetracker:l2damagetracker:0.3.7")
    implementation fg.deobf("dev.xkmc.l2modularblock:l2modularblock:1.1.0")
    implementation fg.deobf("dev.xkmc.mob_weapon_api:mob_weapon_api:0.2.14")
    implementation fg.deobf("dev.xkmc.modulargolems:modulargolems:${modulargolems_version}")
    implementation fg.deobf("com.tterrag.registrate:Registrate:${registrate_version}")
    implementation fg.deobf("maven.modrinth:mekanism:uxe1WQp4")

    // Optional integrations, compiled against local jars; never loaded at runtime unless
    // Golem Magicka / Iron's Spells are present (see CompatDispatch and the mixin plugin).
    compileOnly fg.deobf(files("libs/golemmagicka-0.2.0.jar"))
    compileOnly fg.deobf(files("libs/irons_spellbooks-1.20.1-3.15.4.jar"))
    compileOnly fg.deobf(files("libs/l2artifacts-2.4.28.jar"))
    compileOnly fg.deobf(files("libs/jei-1.20.1-forge-15.20.0.130.jar"))
    compileOnly fg.deobf(files("libs/Jade-1.20.1-Forge-11.13.2.jar"))
}

// -------------------------------------------------------------------------------------
// 测试台的 tag：档位伤害类型要进哪些 tag。注意其中 6 条路径 main 也有同名文件，而同一个数据包
// 不能有两个同路径文件 —— 所以构建期读 main 的原文件、追加档位 id、生成到
// build/generated/testbench-tags，并（只在 -Ptestbench 时）把 main 的那几条排除掉。
// 好处是永远不用手工维护"main 副本"：改 main 的 tag 会自动带过来。
// -------------------------------------------------------------------------------------
def testbenchTagAdditions = [
        'data/minecraft/tags/damage_type/bypasses_armor.json'          : ['armor', 'armor_ench', 'pierce4', 'true_edge', 'true_edge_cd', 'magic', 'fire'],
        'data/minecraft/tags/damage_type/bypasses_enchantments.json'   : ['armor_ench', 'pierce4', 'true_edge', 'true_edge_cd', 'magic', 'fire'],
        'data/minecraft/tags/damage_type/bypasses_effects.json'        : ['pierce4', 'true_edge', 'true_edge_cd', 'magic', 'fire'],
        'data/minecraft/tags/damage_type/bypasses_resistance.json'     : ['pierce4', 'true_edge', 'true_edge_cd', 'magic', 'fire'],
        'data/minecraft/tags/damage_type/bypasses_invulnerability.json': ['true_edge', 'true_edge_cd'],
        'data/minecraft/tags/damage_type/bypasses_cooldown.json'       : ['true_edge_cd'],
        'data/minecraft/tags/damage_type/is_fire.json'                 : ['fire'],
        'data/minecraft/tags/damage_type/is_magic.json'                : ['magic'],
        'data/forge/tags/damage_type/is_magic.json'                    : ['magic'],
]

def testbenchTagOut = layout.buildDirectory.dir('generated/testbench-tags')

tasks.register('generateTestbenchTags') {
    def mainRes = file('src/main/resources')
    def additions = testbenchTagAdditions
    def out = testbenchTagOut
    inputs.dir(mainRes)
    outputs.dir(out)
    doLast {
        def outDir = out.get().asFile
        outDir.deleteDir()
        additions.each { path, tiers ->
            def src = new File(mainRes, path)
            def map = new LinkedHashMap()
            if (src.exists()) {
                map.putAll(new groovy.json.JsonSlurper().parse(src))
            }
            def values = new ArrayList(map['values'] == null ? [] : map['values'])
            tiers.each { values.add('golems_arsenal:ga_test_' + it) }
            map['replace'] = false
            map['values'] = values
            def dst = new File(outDir, path)
            dst.parentFile.mkdirs()
            dst.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(map))
        }
    }
}

if (testbenchEnabled) {
    // 生成的 tag 文件并进测试台资源；main 的同名文件在这个构建里让位（普通构建完全不受影响）
    sourceSets.testbench.resources.srcDir(testbenchTagOut)
    tasks.named('processTestbenchResources', ProcessResources).configure {
        dependsOn 'generateTestbenchTags'
    }
    tasks.named('processResources', ProcessResources).configure {
        exclude(testbenchTagAdditions.keySet() as String[])
    }
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version: forge_version,
            forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    // 私有测试台：只有 -Ptestbench 才把 testbench 的输出并进 jar，并改分类器以便一眼分辨。
    // 普通构建连这个分支都不会进，发布产物里不存在任何测试代码与测试数据包。
    if (testbenchEnabled) {
        archiveClassifier = 'testbench'
        from sourceSets.testbench.output
        doFirst {
            logger.lifecycle('')
            logger.lifecycle('################################################################')
            logger.lifecycle('#  正在构建【私有测试台】jar —— 私活测试用，不要发布、不要上传 GitHub  #')
            logger.lifecycle('################################################################')
            logger.lifecycle('')
        }
    }
    manifest {
        attributes([
                "Specification-Title"     : mod_id,
                "Specification-Vendor"    : mod_authors,
                "Specification-Version"   : "1",
                "Implementation-Title"    : project.name,
                "Implementation-Version"  : project.jar.archiveVersion,
                "Implementation-Vendor"   : mod_authors,
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "MixinConfigs"            : "${mod_id}.mixins.json,${mod_id}.golemmagicka.mixins.json"
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
